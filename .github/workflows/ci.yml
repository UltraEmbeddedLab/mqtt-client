name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

# Every `uses:` is pinned to a commit SHA with the tag in a trailing comment. A mutable
# tag lets a compromised action repository run arbitrary code with CODECOV_TOKEN in scope.

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']

    name: PHP ${{ matrix.php }} Tests

    env:
      MQTT_HOST: 127.0.0.1
      MQTT_PORT: 1883

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl
          coverage: xdebug

      # Started from the repo's compose file rather than a `services:` block: the stock
      # eclipse-mosquitto:2 config refuses anonymous remote connections, while
      # docker/mosquitto/mosquitto.conf is what the examples and tests expect. Without a
      # live broker the Integration suite marks itself skipped and the build stays green
      # having exercised nothing that touches a socket.
      - name: Start Mosquitto
        run: docker compose up -d --wait

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Integration tests must run, not skip
        run: |
          output=$(vendor/bin/pest --testsuite=Integration 2>&1)
          echo "$output"
          if echo "$output" | grep -qi "broker not available"; then
            echo "::error::Integration tests skipped despite a running broker"
            exit 1
          fi

      # --min is what makes coverage a gate; without it the run reports and passes.
      # Measured 53.5% with the broker running. Ratchet upward, never down.
      - name: Run tests with coverage
        run: vendor/bin/pest --coverage --coverage-clover=coverage.xml --min=50

      - name: Upload coverage to Codecov
        if: matrix.php == '8.4'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Stop Mosquitto
        if: always()
        run: docker compose down -v

  install-on-stock-php:
    runs-on: ubuntu-latest
    name: Install on stock php:8.4-cli
    container: php:8.4-cli
    # Guards against a phantom extension requirement. `ext-sockets` sat in `require`
    # while nothing in src/ ever called a socket_* function, so `composer require` failed
    # on the official images while every other job stayed green.
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install composer
        run: |
          apt-get update && apt-get install -y --no-install-recommends git unzip
          curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer

      - name: Install runtime dependencies only
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress

      - name: Smoke test the autoloader with no optional extensions
        run: |
          php -r 'require "vendor/autoload.php";
            $o = new ScienceStories\Mqtt\Client\Options(host: "localhost");
            $t = new ScienceStories\Mqtt\Testing\InMemoryTransport();
            new ScienceStories\Mqtt\Client\Client($o, $t);
            echo "ok\n";'

  code-style:
    runs-on: ubuntu-latest
    name: Code Style

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.4'
          extensions: openssl

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check code style
        run: composer pint -- --test

      # An unparseable workflow makes GitHub fail the run in 0 seconds with no job logs,
      # which is painful to diagnose. Catch it here — and locally via `composer lint`.
      - name: Lint workflow YAML
        run: composer lint:workflows

  static-analysis:
    runs-on: ubuntu-latest
    name: Static Analysis

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.4'
          extensions: openssl

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHPStan
        run: composer stan

  type-coverage:
    runs-on: ubuntu-latest
    name: Type Coverage

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.4'
          extensions: openssl
          coverage: xdebug

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # Without --min the plugin defaults to 0.0, so the documented 85% floor never failed.
      - name: Check type coverage
        run: php -d memory_limit=512M vendor/bin/pest --type-coverage --min=85

  rector-compliance:
    runs-on: ubuntu-latest
    name: Rector Compliance

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.4'
          extensions: openssl

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check Rector compliance
        run: composer rector:check

  examples:
    runs-on: ubuntu-latest
    name: Examples

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.4'
          extensions: openssl

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Lint every example and benchmark
        run: |
          status=0
          for f in examples/*.php examples/config.php.dist benchmarks/*.php; do
            [ -f "$f" ] || continue
            php -l "$f" > /dev/null || status=1
          done
          exit $status

      # The examples used to require a gitignored config.php with no committed template,
      # so 17 of 20 fatally failed on a fresh clone.
      # Block scalar, not a plain one: the PHP here contains ": " (from the ternary),
      # which YAML would read as a mapping indicator and reject the whole file.
      - name: Examples must load their config on a fresh clone
        run: |
          php -r '
            require "vendor/autoload.php";
            $c = require "examples/config.php.dist";
            if (!isset($c["host"])) { fwrite(STDERR, "config.php.dist did not return a host\n"); exit(1); }
            echo "config loads: {$c["host"]}:{$c["port"]}\n";'

  security-audit:
    runs-on: ubuntu-latest
    name: Security Audit

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.4'

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check for known vulnerabilities
        run: composer audit
